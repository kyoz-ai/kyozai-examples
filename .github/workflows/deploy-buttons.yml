name: Deploy buttons

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v7
        with:
          script: |
            const { existsSync, readdirSync } = require('node:fs');
            const applications = readdirSync('.', { withFileTypes: true })
              .filter((entry) => entry.isDirectory() && existsSync(`${entry.name}/kyozai.json`))
              .map((entry) => entry.name)
              .sort();
            const marker = '<!-- kyozai-deploy-buttons -->';
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const ref = context.payload.pull_request.head.ref;
            const buttons = applications.map((application) => {
              const url = `https://my.kyoz.ai/deploy?repo=${repository}&ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(application)}`;
              return `- [${application}](${application}/) [![Deploy on kyoz.ai](https://img.shields.io/badge/Deploy_on-kyoz.ai-172554)](${url})`;
            });
            const body = `${marker}\nこのbranch(\`${ref}\`)のApplicationをkyoz.aiで試す:\n\n${buttons.join('\n')}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body !== undefined && comment.body.startsWith(marker));
            if (existing === undefined) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            } else {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            }
